<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="sakura-version" content="2.0.1">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FFF4F2">
<title>Sakura</title>
<style>
:root{
  --bg:#FFF6F3; --card:#FFFFFF; --ink:#2B2140; --muted:#8C82A3; --line:#F1E8F4;
  --pink:#FF8FA3; --lav:#B48CFF; --mint:#4FCFA8; --peach:#FFB38A; --gold:#FFC94D;
  --grad:linear-gradient(135deg,#FF9AAE 0%,#C08BFF 100%);
  --grad2:linear-gradient(135deg,#FFD1C2 0%,#E7D6FF 100%);
  --shadow:0 8px 28px rgba(120,70,150,.10);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(420px 320px at 100% -5%,rgba(192,139,255,.28),transparent 70%),
  radial-gradient(380px 300px at -10% 25%,rgba(255,154,174,.25),transparent 70%),
  radial-gradient(400px 300px at 110% 80%,rgba(255,200,160,.22),transparent 70%),var(--bg)}
input,select,textarea,button{font:inherit;color:inherit}
input,textarea{-webkit-user-select:text;user-select:text}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,h4{margin:0}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 10px}
.hello{font-size:24px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:14px 0}
.card h3{font-size:18px;font-weight:800}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.hero{background:var(--grad);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero .date{opacity:.9;font-size:14px;font-weight:600}
.hero h2{font-size:20px;line-height:1.3;margin:6px 0 14px;font-weight:800;max-width:90%}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.22);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;backdrop-filter:blur(6px)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{text-align:center;padding:8px 0;border-radius:14px;background:#FBF7FD}
.wd b{display:block;font-size:16px;margin-top:2px}
.wd span{font-size:11px;color:var(--muted);font-weight:700}
.wd.on{background:var(--grad);color:#fff}.wd.on span{color:#fff}
.wd.today{outline:2px solid var(--lav);outline-offset:-2px}
.wd{border:0;font:inherit;color:inherit;transition:transform .15s}.wd:active{transform:scale(.92)}
.wd.sel{outline:2.5px solid var(--ink);outline-offset:-2.5px;transform:translateY(-3px);box-shadow:0 6px 14px rgba(43,33,64,.15)}
.pillbtn{border:0;color:#fff;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:13px 18px;font-weight:800;font-size:16px;background:#F5EEFA;color:var(--ink);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(192,139,255,.35)}
.btn.mint{background:var(--mint);color:#fff}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{background:#FFE8EC;color:#E0476A}
.btn.block{width:100%}
.btn svg{width:20px;height:20px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{display:flex;align-items:center;gap:12px;padding:8px;border-radius:18px;background:#FCF9FE;width:100%;text-align:left}
.item:active{background:#F5EEFA}
.thumb{width:64px;height:46px;border-radius:14px;background:var(--grad2);flex-shrink:0;overflow:hidden}
.item .t{font-weight:800;font-size:15px}
.item .d{color:var(--muted);font-size:13px;margin-top:2px}
.item .grow{flex:1;min-width:0}
.chev{color:#CBBFDC;font-size:22px;padding-right:6px}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
.empty .e{font-size:40px;display:block;margin-bottom:6px}
.fig{width:100%;height:100%;display:block}
.fig .limb{fill:none;stroke:#5A3D8F;stroke-width:5.2;stroke-linecap:round;stroke-linejoin:round}
.fig .limb.far{stroke:#C7B2EC}
.fig .limb.torso{stroke:#5A3D8F;stroke-width:6.5}
.fig .head{fill:#FF9AAE}
.fig .mat{fill:#E9DDFB}
.fig .shadow{fill:rgba(90,61,143,.10)}
.nofig{width:100%;height:100%;display:grid;place-items:center;font-size:26px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom))}
nav.tabs .tbar{max-width:520px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;padding:7px;box-shadow:0 10px 30px rgba(100,60,140,.18)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:18px;color:var(--muted);font-size:10px;letter-spacing:-.2px;font-weight:800;transition:all .2s}
.tab svg{width:23px;height:23px}
.tab.on{background:var(--grad);color:#fff}
/* sheet */
.layer{position:fixed;inset:0;z-index:40;display:none}
.layer.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(43,33,64,.38);opacity:0;transition:opacity .25s}
.layer.show .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--bg);border-radius:28px 28px 0 0;max-height:92vh;overflow-y:auto;padding:10px 16px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.layer.show .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:#DCCFE8;margin:2px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sheet-h h3{font-size:22px;font-weight:800}
.x{width:38px;height:38px;border-radius:12px;background:#F2EAF8;display:grid;place-items:center;font-size:18px;color:var(--muted);flex-shrink:0}
.stage{height:190px;border-radius:24px;background:var(--grad2);margin:6px 0 12px;position:relative;overflow:hidden}
.stage .fig{height:100%}
.tip{background:#fff;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.45;color:#5C5372;margin-bottom:10px}
.lbl{font-size:13px;font-weight:800;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.4px}
.field{width:100%;border:2px solid var(--line);background:#fff;border-radius:16px;padding:13px 14px;font-size:16px;outline:none}
.field:focus{border-color:var(--lav)}
.stepper{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:8px;box-shadow:var(--shadow)}
.stepper button{flex-shrink:0;width:52px;height:52px;border-radius:16px;background:#F5EEFA;font-size:26px;font-weight:800;color:#7A55C9}
.stepper button:active{transform:scale(.93)}
.stepper input{width:100%;min-width:0;text-align:center;border:0;font-size:30px;font-weight:900;outline:none;background:transparent}
.stepper .u{font-size:13px;color:var(--muted);font-weight:700;margin-top:-4px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.set{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:8px 8px 8px 12px;font-weight:800;box-shadow:var(--shadow);font-size:15px}
.set i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;font-size:12px;display:grid;place-items:center}
.set button{color:#C9B8DC;font-size:16px;padding:0 4px}
.prev{background:#fff;border-radius:16px;padding:10px 14px;font-size:14px;display:flex;gap:14px;flex-wrap:wrap}
.prev b{color:#7A55C9}
.sw{width:170px;height:170px;border-radius:50%;margin:8px auto;display:grid;place-items:center;background:#fff;box-shadow:var(--shadow);position:relative}
.sw .v{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums}
.sw .s{font-size:13px;color:var(--muted);font-weight:700;text-align:center}
.sw.run{background:var(--grad);color:#fff}.sw.run .s{color:#fff}
.check{width:100%;padding:22px;border-radius:22px;background:#fff;box-shadow:var(--shadow);font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px}
.check.on{background:var(--mint);color:#fff}
.seg{display:flex;background:#F2EAF8;border-radius:16px;padding:4px;gap:4px;overflow-x:auto}
.seg button{flex:1;padding:9px 10px;border-radius:12px;font-weight:800;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.excard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;text-align:left;display:flex;flex-direction:column}
.excard .pic{height:96px;background:var(--grad2)}
.excard .bd{padding:10px 12px 12px}
.excard .t{font-weight:800;font-size:15px;line-height:1.2}
.excard .d{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600}
.excard.add{align-items:center;justify-content:center;min-height:150px;border:2px dashed #DCCBF0;background:transparent;box-shadow:none;color:#9A7CD6;font-weight:800;gap:6px}
.excard.add .plus{font-size:34px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#F2EAF8;color:#7A55C9}
.badge.str{background:#FFE6EC;color:#E25878}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:#FCF9FE;border-radius:16px;padding:12px}
.stat b{font-size:24px;font-weight:900;display:block}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:8px -16px 0;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:9px 14px;border-radius:999px;background:#F5EEFA;font-weight:800;font-size:14px;color:#6E5C8C}
.chip.on{background:var(--grad);color:#fff}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal .h{text-align:center;font-size:11px;font-weight:800;color:var(--muted)}
.cal .c{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:700;background:#FBF7FD;color:#8C82A3}
.cal .c.on{background:var(--pink);color:#fff}
.cal .c.st{background:var(--lav);color:#fff}
.cal .c.both{background:var(--grad);color:#fff}
.cal .c.today{outline:2px solid var(--ink);outline-offset:-2px}
.cal .c.x{background:transparent}
.delta{font-weight:900;font-size:14px;padding:3px 8px;border-radius:999px}
.delta.up{background:#DDF7EE;color:#1F9E76}.delta.dn{background:#FFE8EC;color:#E0476A}.delta.eq{background:#F2EAF8;color:#7A55C9}
.goal{background:#FCF9FE;border-radius:18px;padding:14px;margin-top:10px}
.goal.done{background:linear-gradient(135deg,#FFF3D6,#FFE3EC)}
.goal .gt{font-weight:800;font-size:15px}
.goal .gp{font-size:14px;margin-top:6px;color:#6E5C8C}
.bar{height:10px;border-radius:6px;background:#EFE5F6;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--grad);transition:width .6s}
.achs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.ach{background:#FCF9FE;border-radius:18px;padding:12px 6px;text-align:center}
.ach .e{font-size:30px;display:block}
.ach .n{font-size:12px;font-weight:800;margin-top:4px;line-height:1.2}
.ach .d{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.2}
.ach.lock{opacity:.45;filter:grayscale(1)}
.animpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.animpick button{height:70px;border-radius:14px;background:#fff;border:2px solid transparent;overflow:hidden}
.animpick button.on{border-color:var(--lav);background:#F5EEFA}
.togg{display:flex;align-items:center;gap:10px;font-weight:700;margin-top:12px}
.togg input{width:22px;height:22px;accent-color:#B48CFF}
/* modal */
.modal{position:absolute;left:20px;right:20px;top:50%;max-width:420px;margin:0 auto;background:#fff;border-radius:30px;padding:26px 22px 20px;text-align:center;transform:translate(0,-40%) scale(.9);opacity:0;transition:all .35s cubic-bezier(.2,1.4,.4,1)}
.layer.show .modal{transform:translate(0,-50%) scale(1);opacity:1}
.modal .big{font-size:72px;line-height:1;display:inline-block;animation:pop 1.6s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.18) rotate(-8deg)}60%{transform:scale(1.05) rotate(6deg)}}
.modal h2{font-size:24px;font-weight:900;margin:12px 0 6px}
.modal p{color:#5C5372;line-height:1.45;margin:0 0 14px;font-size:16px}
.prize{background:var(--grad);color:#fff;border-radius:20px;padding:14px;margin:0 0 16px;font-weight:800;font-size:17px;line-height:1.35}
.prize small{display:block;font-size:12px;opacity:.9;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.ring{width:210px;height:210px;margin:6px auto 12px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:52px;font-weight:900;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:70;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:800;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.2);transition:transform .35s cubic-bezier(.2,1.3,.4,1);max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;z-index:80;pointer-events:none;width:100vw;height:100vh}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
textarea.field{min-height:110px;font-size:12px;font-family:ui-monospace,monospace}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
.foot b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* v2 */
.hero .hl{background:rgba(255,255,255,.25);padding:0 8px;border-radius:10px;white-space:nowrap}
.hbar{height:8px;border-radius:5px;background:rgba(255,255,255,.25);margin-top:14px;overflow:hidden}
.hbar i{display:block;height:100%;background:#fff;border-radius:5px;transition:width .6s}
.wd{position:relative}.wd i{position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--lav)}
.chipbtn{background:#F5EEFA;color:#7A55C9;font-weight:800;font-size:14px;padding:8px 12px;border-radius:12px}
.item.plan{cursor:pointer}
.item.plan .tick{cursor:pointer;font-size:17px;transition:transform .15s;width:30px;height:30px;border-radius:50%;border:2.5px solid #DCCBF0;display:grid;place-items:center;color:#fff;font-weight:900;flex-shrink:0;margin-right:4px}
.item.plan.done{background:#EFFBF6}.item.plan.done .tick{background:var(--mint);border-color:var(--mint)}
.item.plan .tick:active{transform:scale(.85)}
.item.plan.pop .tick{animation:tickpop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes tickpop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.item.plan.done .t{text-decoration:line-through;text-decoration-color:rgba(43,33,64,.35)}
.cta{border:2px dashed #E3D3F5;box-shadow:none;background:rgba(255,255,255,.7)}
.days{display:flex;flex-direction:column;gap:10px}
.day{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px;text-align:left;width:100%}
.day.today{outline:2.5px solid var(--lav);outline-offset:-2.5px}
.day.rest{background:rgba(255,255,255,.65);box-shadow:none}
.day .dl{width:48px;height:52px;border-radius:14px;background:var(--grad);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.day.rest .dl{background:#EFE6F7;color:#8C82A3}
.day .dl b{font-size:15px}.day .dl span{font-size:12px;font-weight:700;opacity:.9}
.day .t{font-weight:800;font-size:16px}.day .d{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35}
.day .grow{flex:1;min-width:0}
.ovb{font-size:12px;font-weight:700;color:#C2577A;background:#FFEEF2;border-radius:10px;padding:4px 8px;margin-top:6px;display:inline-block}
.item.pe{flex-direction:column;align-items:stretch;background:#fff;box-shadow:var(--shadow)}
.item.pe.sel{outline:2px solid var(--lav)}
.ed{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.mini{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-weight:700;color:#5C5372}
.ms{display:flex;align-items:center;gap:10px}
.ms button{width:38px;height:38px;border-radius:12px;background:#F5EEFA;font-size:20px;font-weight:800;color:#7A55C9}
.ms b{min-width:44px;text-align:center;font-size:18px}
.planp{background:#F3ECFF;margin-bottom:8px}
.step{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.step .st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:#F2EAF8;color:#8C82A3;flex-shrink:0}
.step .st.ok{background:var(--mint);color:#fff}.step .st.no{background:#FFE1E8;color:#E0476A}
.step b{font-size:15px}.step .grow{flex:1;min-width:0}
.switch{position:relative;width:52px;height:30px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#E5DAF0;border-radius:20px;transition:.2s}
.switch span::before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.switch input:checked+span{background:var(--lav)}.switch input:checked+span::before{transform:translateX(22px)}
.upd{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:30;max-width:496px;margin:0 auto;background:var(--ink);color:#fff;border-radius:20px;padding:12px 12px 12px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px rgba(43,33,64,.35);animation:fade .4s ease}
.upd .grow{flex:1;font-weight:700;font-size:14px;line-height:1.3}.upd small{display:block;opacity:.75;font-weight:600}
.upd .btn{padding:10px 14px;font-size:14px}
.wn{text-align:left;margin:0 0 16px;padding:0;list-style:none}.wn li{padding:7px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.35}
</style>
</head>
<body>
<div id="app">

function entrySummary(ex, sets) {
  const st = dayStat(ex, sets);
  if (ex.type === 'check') return 'Сделала ✓';
  const n = sets.length + ' ' + plural(sets.length, ['подход','подхода','подходов']);
  if (ex.type === 'time') return n + ' · лучший ' + fmtSec(st.best);
  return n + ' · ' + sets.map(s => num(s.reps)).join(' / ') + (st.kg ? ' · до ' + st.kg + ' кг' : '');
}

function selDay(k) { U.selDate = k === today() ? null : k; vibe(8); render(); }
function quickTick(ev, id, date) {
  ev.stopPropagation();
  const it = planItems(date).find(i => i.exId === id), ex = exById(id); if (!it || !ex) return;
  const cur = (S.sessions[date] && S.sessions[date][id]) || [];
  if (itemProgress(it, date).done) {
    if (cur.some(s => !s.q)) { openModal(`<span class="big" style="animation:none">↩️</span><h2>Снять отметку?</h2><p>Записанные подходы по «${esc(ex.name)}» за этот день удалятся.</p><div class="two"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn danger" onclick="closeModal();unTick('${id}','${date}')">Снять</button></div>`); return; }
    unTick(id, date); return;
  }
  const prevBest = Math.max(0, ...history(id).filter(x => x.d !== date).map(x => x.best));
  S.sessions[date] = S.sessions[date] || {};
  if (ex.type === 'check') S.sessions[date][id] = [{ done: 1, q: 1 }];
  else { const add = []; for (let k = cur.length; k < Math.max(1, it.sets || 1); k++) add.push(ex.type === 'time' ? { sec: it.sec || 30, q: 1 } : { reps: it.reps || 10, kg: it.kg || 0, q: 1 }); S.sessions[date][id] = cur.concat(add); }
  save(); vibe(25); U.ticked = id;
  afterSave(id, prevBest, date, '✓ ' + ex.name + ' — сделано!');
}
function unTick(id, date) {
  if (S.sessions[date]) { delete S.sessions[date][id]; if (!Object.keys(S.sessions[date]).length) delete S.sessions[date]; }
  delete S.planDone[date];
  save(); vibe(10); render(); toast('Отметка снята');
}

/* ---------- weekly plan ---------- */
const WD_FULL = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const WD_ACC = ['в понедельник','во вторник','в среду','в четверг','в пятницу','в субботу','в воскресенье'];
const wdOf = k => (parseD(k).getDay() + 6) % 7;
function planFor(date) { if (S.overrides[date]) return S.overrides[date]; return S.plan[wdOf(date)] || null; }
function planItems(date) { const p = planFor(date); return p && p.items ? p.items.filter(i => exById(i.exId)) : []; }
const hasPlan = () => Object.values(S.plan).some(d => d && d.items && d.items.some(i => exById(i.exId)));
function itemProgress(it, date) {
  const ex = exById(it.exId), sets = (S.sessions[date] && S.sessions[date][it.exId]) || [];
  if (!ex) return { n: 0, need: 1, done: false };
  if (ex.type === 'check') { const d = sets.some(s => s.done); return { n: d ? 1 : 0, need: 1, done: d }; }
  const need = Math.max(1, it.sets || 1); return { n: Math.min(sets.length, need), need, done: sets.length >= need };
}
function fmtTarget(it) {
  const ex = exById(it.exId); if (!ex) return '';
  if (ex.type === 'check') return 'выполнить';
  if (ex.type === 'time') return (it.sets || 1) + ' × ' + fmtSec(it.sec || 30);
  return (it.sets || 1) + ' × ' + (it.reps || 10) + (it.kg ? ' · ' + it.kg + ' кг' : '');
}
function defItem(ex) { return ex.type === 'time' ? { exId: ex.id, sets: 2, sec: 30 } : ex.type === 'check' ? { exId: ex.id, sets: 1 } : { exId: ex.id, sets: 3, reps: 12, kg: 0 }; }
function nextDateOf(wd) { const t = today(); for (let i = 0; i < 7; i++) { const k = addDays(t, i); if (wdOf(k) === wd) return k; } return t; }
const SAMPLE = {
  0: { title: 'Ноги и попа', items: [['squat',3,15],['lunge',3,12],['bridge',3,20],['fold',2,0,30]] },

/* day editor */
let DE = null;
function editDay(mode, key) {

function loadDE() {
  const src = DE.scope === 'once' ? (S.overrides[DE.date] || S.plan[DE.wd]) : S.plan[DE.wd];
  DE.title = (src && src.title) || ''; DE.items = src && src.items ? src.items.filter(i => exById(i.exId)).map(i => ({ ...i })) : []; DE.sel = -1;
}
function syncDE() { const el = $('#deTitle'); if (el) DE.title = el.value; }
function setScope(sc) { syncDE(); DE.scope = sc; loadDE(); renderDE(); }
function deStep(i, f, d, mn) { syncDE(); const it = DE.items[i]; it[f] = Math.max(mn, Math.round(((+it[f] || 0) + d) * 10) / 10); vibe(8); renderDE(); }
function deMove(i, d) { syncDE(); const j = i + d; if (j < 0 || j >= DE.items.length) return; const a = DE.items; [a[i], a[j]] = [a[j], a[i]]; DE.sel = j; renderDE(); }
function deDel(i) { syncDE(); DE.items.splice(i, 1); DE.sel = -1; renderDE(); }
function deAdd(id) { const ex = exById(id); DE.items.push(defItem(ex)); DE.picking = false; DE.sel = DE.items.length - 1; if (!DE.title && DE.items.length === 1) DE.title = ex.cat === 'stretch' ? 'Растяжка' : 'Тренировка'; renderDE(); }
function deCopy(i) { syncDE(); const src = S.plan[i]; DE.items = src && src.items ? src.items.map(x => ({ ...x })) : []; DE.title = (src && src.title) || DE.title; DE.sel = -1; renderDE(); toast('Скопировано из: ' + WD_FULL[i]); }
function renderDE() {
  const keep = sheetOpen() ? $('#sheet').scrollTop : 0;
  if (DE.picking) {
    const grp = (cat, title) => `<div class="lbl">${title}</div><div class="list" style="margin-top:0">` + allEx().filter(e => e.cat === cat).map(e => `<button class="item" onclick="deAdd('${e.id}')"><div class="thumb" data-fig="${e.anim}"></div><div class="grow"><div class="t">${esc(e.name)}</div><div class="d">${TYPE_NAMES[e.type]}${DE.items.some(x => x.exId === e.id) ? ' · уже в плане' : ''}</div></div><span class="chev">＋</span></button>`).join('') + '</div>';
    openSheet(`<div class="sheet-h"><button class="x" onclick="DE.picking=false;renderDE()">‹</button><h3 style="flex:1">Добавить упражнение</h3></div>` + grp('strength', '💪 Сила') + grp('stretch', '🧘‍♀️ Растяжка'));
    return;
  }
  const hasOv = !!S.overrides[DE.date];
  const items = DE.items.map((it, i) => { const ex = exById(it.exId), sel = DE.sel === i;
    let ed = '';
    if (sel) {
      const st = (lbl, f, d, mn, val) => `<div class="mini"><span>${lbl}</span><div class="ms"><button onclick="event.stopPropagation();deStep(${i},'${f}',${-d},${mn})">−</button><b>${val}</b><button onclick="event.stopPropagation();deStep(${i},'${f}',${d},${mn})">+</button></div></div>`;
      ed = `<div class="ed" onclick="event.stopPropagation()">` + (ex.type === 'check' ? '<div class="small muted">Просто отметить «сделала» ✓</div>' :
        st('Подходы', 'sets', 1, 1, it.sets || 1) + (ex.type === 'time' ? st('Секунд', 'sec', 5, 5, it.sec || 30) : st('Повторов', 'reps', 1, 1, it.reps || 10) + st('Вес, кг', 'kg', 0.5, 0, it.kg || 0))) +
        `<div class="row" style="gap:8px;margin-top:10px"><button class="btn" style="flex:1;padding:9px" onclick="deMove(${i},-1)">↑</button><button class="btn" style="flex:1;padding:9px" onclick="deMove(${i},1)">↓</button><button class="btn danger" style="flex:2;padding:9px" onclick="deDel(${i})">Убрать</button></div></div>`;
    }
    return `<div class="item pe ${sel ? 'sel' : ''}" onclick="syncDE();DE.sel=${sel ? -1 : i};renderDE()"><div class="row" style="width:100%;gap:12px"><div class="thumb" data-fig="${ex.anim}"></div><div class="grow"><div class="t">${i + 1}. ${esc(ex.name)}</div><div class="d">${fmtTarget(it)}</div></div><span class="chev">${sel ? '⌃' : '✎'}</span></div>${ed}</div>`;
  }).join('');
  const copy = DE.scope === 'week' ? [0,1,2,3,4,5,6].filter(i => i !== DE.wd && S.plan[i] && S.plan[i].items && S.plan[i].items.length).map(i => `<button class="chip" onclick="deCopy(${i})">${WD[i]}${S.plan[i].title ? ' · ' + esc(S.plan[i].title) : ''}</button>`).join('') : '';
  openSheet(head(WD_FULL[DE.wd]) +
    `<div class="seg"><button class="${DE.scope === 'week' ? 'on' : ''}" onclick="setScope('week')">🔁 Каждую неделю</button><button class="${DE.scope === 'once' ? 'on' : ''}" onclick="setScope('once')">📌 Только ${fmtDate(DE.date)}</button></div>
    <div class="small muted" style="margin:8px 2px 0">${DE.scope === 'week' ? 'Изменения будут повторяться каждую неделю.' : `Изменится только ${fmtDate(DE.date)}, план на другие недели останется прежним.`}</div>
    <div class="lbl">Название</div><input class="field" id="deTitle" placeholder="Например: Ноги и попа" value="${esc(DE.title)}" maxlength="30">
    <div class="chips" style="margin-top:6px">${['Ноги и попа','Верх и пресс','Всё тело','Растяжка','Кардио'].map(n => `<button class="chip" onclick="$('#deTitle').value='${n}';DE.title='${n}'">${n}</button>`).join('')}</div>
    <div class="lbl">Упражнения ${DE.items.length ? '· ' + DE.items.length : ''}</div>
    ${DE.items.length ? `<div class="list" style="margin-top:0">${items}</div>` : `<div class="empty"><span class="e">😴</span>День отдыха</div>`}
    <button class="btn mint block" style="margin-top:10px" onclick="syncDE();DE.picking=true;renderDE()">${IC.plus} Добавить упражнение</button>
    ${copy ? `<div class="lbl">Скопировать из</div><div class="chips" style="margin-top:0">${copy}</div>` : ''}
    <button class="btn primary block" style="margin-top:18px" onclick="saveDE()">Сохранить</button>
    ${DE.items.length ? `<button class="btn ghost block" style="margin-top:4px" onclick="syncDE();DE.items=[];DE.sel=-1;renderDE()">Сделать днём отдыха</button>` : ''}
    ${DE.scope === 'once' && hasOv ? `<button class="btn ghost block" style="margin-top:4px" onclick="resetOv()">↩️ Вернуть как в плане</button>` : ''}`);
  $('#sheet').scrollTop = keep;
}
function saveDE() {
  syncDE();
  const v = { title: DE.title.trim(), items: DE.items.map(x => ({ ...x })) };
  if (DE.scope === 'week') { S.plan[DE.wd] = v; for (const k in S.overrides) if (k < today()) delete S.overrides[k]; scheduleReminders(); }
  else S.overrides[DE.date] = v;
  save(); DE = null; closeSheet(); render();
  toast(v.items.length ? 'План сохранён 📅' : 'День отдыха 😴');
}
function resetOv() { delete S.overrides[DE.date]; save(); DE = null; closeSheet(); render(); toast('Вернули как в плане ↩️'); }

function vEx() {
  const f = U.exFilter;
  const list = allEx().filter(e => f === 'all' || (f === 'mine' ? e.custom : e.cat === f));
  const cards = list.map(e => { const b = bestIn(e.id, () => true); return `<button class="excard" onclick="openExercise('${e.id}')"><div class="pic" data-fig="${e.anim}"></div><div class="bd"><div class="t">${esc(e.name)}</div><div class="d"><span class="badge ${e.cat === 'strength' ? 'str' : ''}">${CAT_NAMES[e.cat]}</span> ${b ? '· 🏆 ' + fmtVal(e, b) : ''}</div></div></button>`; }).join('');
  return `<div class="seg">${[['all','Все'],['strength','Сила'],['stretch','Растяжка'],['mine','Мои']].map(([k, n]) => `<button class="${f === k ? 'on' : ''}" onclick="U.exFilter='${k}';render()">${n}</button>`).join('')}</div>
  <div class="grid2">${cards}<button class="excard add" onclick="openCustom()"><span class="plus">＋</span>Своё упражнение</button></div>`;
}

function chart(points, opt) {
  opt = opt || {};
  if (points.length < 2) return `<div class="empty small"><span class="e" style="font-size:30px">📊</span>Нужно хотя бы 2 записи, чтобы нарисовать график</div>`;
  const W = 340, H = 170, pl = 10, pr = 10, pt = 26, pb = 24, id = 'g' + uid();
  const vs = points.map(p => p.v); let mn = Math.min(...vs), mx = Math.max(...vs);
  if (mn === mx) { mn -= 1; mx += 1; } const sp = mx - mn; mn -= sp * .12; mx += sp * .12;
  const X = i => pl + i * (W - pl - pr) / (points.length - 1), Y = v => pt + (1 - (v - mn) / (mx - mn)) * (H - pt - pb);
  const P = points.map((p, i) => [X(i), Y(p.v)]);
  let d = 'M' + P[0][0] + ',' + P[0][1];
  for (let i = 0; i < P.length - 1; i++) { const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
    d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`; }
  const area = d + ` L${P[P.length - 1][0]},${H - pb} L${P[0][0]},${H - pb} Z`;
  const fmt = opt.fmt || (v => v);
  const last = P[P.length - 1], lv = points[points.length - 1].v;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C08BFF" stop-opacity=".35"/><stop offset="1" stop-color="#FF9AAE" stop-opacity="0"/></linearGradient><linearGradient id="${id}l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF9AAE"/><stop offset="1" stop-color="#B48CFF"/></linearGradient></defs>
  <path d="${area}" fill="url(#${id})"/><path d="${d}" fill="none" stroke="url(#${id}l)" stroke-width="3.5" stroke-linecap="round"/>
  ${P.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="#B48CFF" stroke-width="2"/>`).join('')}
  <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="#B48CFF"/>
  <text x="${Math.min(last[0], W - 4)}" y="${last[1] - 12}" text-anchor="end" font-size="13" font-weight="800" fill="#5A3D8F">${esc(fmt(lv))}</text>
  <text x="${pl}" y="${H - 6}" font-size="11" fill="#8C82A3" font-weight="700">${esc(points[0].l)}</text>
  <text x="${W - pr}" y="${H - 6}" font-size="11" fill="#8C82A3" font-weight="700" text-anchor="end">${esc(points[points.length - 1].l)}</text></svg>`;
}

function calendar(m) {
  const [y, mm] = m.split('-').map(Number), first = new Date(y, mm - 1, 1), sw = (first.getDay() + 6) % 7, days = new Date(y, mm, 0).getDate(), t = today();
  let c = WD.map(w => `<div class="h">${w}</div>`).join('');
  for (let i = 0; i < sw; i++) c += '<div class="c x"></div>';
  for (let i = 1; i <= days; i++) { const k = m + '-' + pad(i); c += `<div class="c ${dayKinds(k)} ${k === t ? 'today' : ''}">${i}</div>`; }
  return c;
}

function vProg() {
  const days = workoutDays(), t = today(), m = mkey(t);
  const used = allEx().filter(e => history(e.id).length);
  if (!U.progEx || !used.find(e => e.id === U.progEx)) U.progEx = used[0] ? used[0].id : null;
  let exBlock = `<div class="empty"><span class="e">📈</span>Запиши первые тренировки — и здесь появится твой прогресс</div>`;
  if (U.progEx) {
    const ex = exById(U.progEx), h = history(ex.id).slice(-20);
    const cur = bestIn(ex.id, d => mkey(d) === m), prev = bestIn(ex.id, d => mkey(d) === prevMonth(m)), rec = bestIn(ex.id, () => true);
    let delta = '';
    if (prev && cur) { const p = Math.round((cur - prev) / prev * 100); delta = `<span class="delta ${p > 0 ? 'up' : p < 0 ? 'dn' : 'eq'}">${p > 0 ? '+' : ''}${p}%</span>`; }
    const kgRec = bestIn(ex.id, () => true, 'kg');
    exBlock = `<div class="chips">${used.map(e => `<button class="chip ${e.id === U.progEx ? 'on' : ''}" onclick="U.progEx='${e.id}';render()">${esc(e.name)}</button>`).join('')}</div>
      ${ex.type === 'check' ? '' : chart(h.map(x => ({ v: x.best, l: fmtDate(x.d) })), { fmt: v => fmtVal(ex, v) })}
      <div class="stats"><div class="stat"><b>${ex.type === 'check' ? h.length : fmtVal(ex, rec)}</b><span>${ex.type === 'check' ? 'раз сделано' : 'рекорд'}</span></div>
      <div class="stat"><b>${cur ? fmtVal(ex, cur) : '—'}</b><span>в ${MONTHS_IN[parseD(t).getMonth()]} ${delta}</span></div>
      ${kgRec ? `<div class="stat"><b>${kgRec} кг</b><span>максимальный вес</span></div>` : ''}
      <div class="stat"><b>${history(ex.id).length}</b><span>${plural(history(ex.id).length, ['тренировка','тренировки','тренировок'])}</span></div></div>`;
  }
  const bw = S.body.slice().sort((a, b) => a.d < b.d ? -1 : 1).slice(-30);
  const [cy, cm] = U.calM.split('-').map(Number);
  return `
  <div class="stats" style="margin-top:4px"><div class="stat" style="background:#fff;box-shadow:var(--shadow)"><b>${days.length}</b><span>всего тренировок</span></div><div class="stat" style="background:#fff;box-shadow:var(--shadow)"><b>${days.filter(d => mkey(d) === m).length}</b><span>в этом месяце</span></div>
  <div class="stat" style="background:#fff;box-shadow:var(--shadow)"><b>${totalReps()}</b><span>повторов всего</span></div><div class="stat" style="background:#fff;box-shadow:var(--shadow)"><b>${maxStreak()}</b><span>лучшая серия, дней</span></div></div>
  <section class="card"><h3>Упражнения</h3>${exBlock}</section>
  <section class="card"><div class="row between"><button class="x" onclick="U.calM=prevMonth(U.calM);render()">‹</button><h3>${MONTHS[cm - 1]} ${cy}</h3><button class="x" onclick="U.calM=nextMonth(U.calM);render()">›</button></div>
    <div class="cal">${calendar(U.calM)}</div>
    <div class="row small muted" style="margin-top:10px;gap:14px;flex-wrap:wrap"><span>🟥 сила</span><span>🟪 растяжка</span><span>🌈 обе</span></div></section>
  <section class="card"><div class="row between"><h3>Вес тела</h3><button class="btn" style="padding:9px 14px;font-size:14px" onclick="openWeight()">Записать</button></div>${chart(bw.map(x => ({ v: x.kg, l: fmtDate(x.d) })), { fmt: v => v + ' кг' })}</section>`;
}

function goalCur(g) { return g.metric === 'kg' ? bestIn(g.exId, () => true, 'kg') : bestIn(g.exId, () => true); }
function fmtGoalVal(g, v) { const ex = exById(g.exId); if (g.metric === 'kg') return v + ' кг'; return fmtVal(ex, v); }
function vRew() {
  const goals = S.goals.slice().sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0));
  const gl = goals.map(g => { const ex = exById(g.exId); if (!ex) return ''; const cur = goalCur(g), pct = Math.min(100, Math.round(cur / g.target * 100));
    return `<div class="goal ${g.done ? 'done' : ''}"><div class="row between"><div class="gt">${g.done ? '✅ ' : ''}${esc(ex.name)} — ${fmtGoalVal(g, g.target)}${g.metric === 'kg' ? '' : ex.type === 'reps' ? ' за подход' : ''}</div><button class="x" style="width:30px;height:30px;font-size:14px" onclick="delGoal('${g.id}')">✕</button></div>
    <div class="gp">${g.done ? '🎁 Награда: <b>' + esc(g.prize) + '</b> · ' + fmtDate(g.done) : 'Награда: ' + (g.hidden ? '🎁 <b>сюрприз</b>' : '<b>' + esc(g.prize) + '</b>')}</div>
    ${g.done ? '' : `<div class="bar"><i style="width:${pct}%"></i></div><div class="small muted" style="margin-top:6px">Сейчас: ${fmtGoalVal(g, cur)} · ${pct}%</div>`}</div>`; }).join('');
  const got = ACH.filter(a => S.ach[a.id]).length;
  return `
  <section class="card"><div class="row between"><h3>Цели и призы</h3><button class="btn primary" style="padding:9px 14px;font-size:14px" onclick="openGoal()">${IC.plus} Цель</button></div>
  ${gl || `<div class="empty"><span class="e">🎁</span>Поставь цель и приз за неё.<br>Например: «15 отжиманий → новая книжечка 📚»</div>`}</section>
  <section class="card"><div class="row between"><h3>Достижения</h3><span class="badge">${got} / ${ACH.length}</span></div>
  <div class="achs">${ACH.map(a => `<div class="ach ${S.ach[a.id] ? '' : 'lock'}"><span class="e">${a.e}</span><div class="n">${a.n}</div><div class="d">${a.d}</div></div>`).join('')}</div></section>`;
}

/* ---------- sheets & modals ---------- */
function openLayer(id) { const L = $(id); L.classList.add('open'); requestAnimationFrame(() => requestAnimationFrame(() => L.classList.add('show'))); }
function closeLayer(id, cb) { const L = $(id); if (!L.classList.contains('open')) return; L.classList.remove('show'); setTimeout(() => { L.classList.remove('open'); cb && cb(); }, 300); }
let onSheetClose = null;
function openSheet(html, after) { REMOPEN = false; swStop(); const sh = $('#sheet'); sh.innerHTML = '<div class="grab"></div>' + html; sh.scrollTop = 0; mountFigs(sh); openLayer('#sheetL'); after && after(); }
function closeSheet() { swStop(); closeLayer('#sheetL', () => { $('#sheet').innerHTML = ''; }); const cb = onSheetClose; onSheetClose = null; cb && cb(); }
function openModal(html) { $('#modal').innerHTML = html; openLayer('#modalL'); }
function closeModal() { restStop(); closeLayer('#modalL', () => { $('#modal').innerHTML = ''; nextCelebrate(); }); }
const sheetOpen = () => $('#sheetL').classList.contains('open');
const modalOpen = () => $('#modalL').classList.contains('open');
const head = t => `<div class="sheet-h"><h3>${t}</h3><button class="x" onclick="closeSheet()">✕</button></div>`;

let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600); }

/* picker */
function openPicker(date) {
  date = date || today();
  const grp = (cat, title) => `<div class="lbl">${title}</div><div class="list" style="margin-top:0">` + allEx().filter(e => e.cat === cat).map(e => `<button class="item" onclick="openLogger('${e.id}','${date}')"><div class="thumb" data-fig="${e.anim}"></div><div class="grow"><div class="t">${esc(e.name)}</div><div class="d">${TYPE_NAMES[e.type]}${e.custom ? ' · моё' : ''}</div></div><span class="chev">›</span></button>`).join('') + '</div>';
  openSheet(head('Выбери упражнение') + grp('strength', '💪 Сила') + grp('stretch', '🧘‍♀️ Растяжка') + `<button class="btn block" style="margin-top:14px" onclick="openCustom()">${IC.plus} Своё упражнение</button>`);
}

/* logger */
let LG = null;
function openLogger(id, date) {
  const ex = exById(id); if (!ex) return;
  date = date || today();
  const existing = (S.sessions[date] && S.sessions[date][id]) || [];
  const h = history(id).filter(x => x.d !== date), lastH = h[h.length - 1];
  const lastSets = lastH ? S.sessions[lastH.d][id] : null;
  const ref = existing[existing.length - 1] || (lastSets && lastSets[lastSets.length - 1]) || {};
  const tgt = planItems(date).find(i => i.exId === id);
  LG = { id, date, tgt, sets: existing.map(s => ({ ...s })), reps: num(ref.reps) || 10, kg: num(ref.kg) || 0, sec: num(ref.sec) || 30, done: existing.length ? !!existing[0].done : false };
  if (tgt && !existing.length) { if (tgt.reps) LG.reps = tgt.reps; if (tgt.sec) LG.sec = tgt.sec; if (tgt.kg != null) LG.kg = tgt.kg; }
  renderLogger();
}
function renderLogger() {
  const ex = exById(LG.id), h = history(ex.id).filter(x => x.d !== LG.date), lastH = h[h.length - 1], rec = Math.max(0, ...h.map(x => x.best));
  let prev = '';
  if (lastH) prev = `<div class="prev"><span>В прошлый раз (${fmtDate(lastH.d)}): <b>${esc(S.sessions[lastH.d][ex.id].map(s => fmtSet(ex, s)).join(', '))}</b></span>${ex.type !== 'check' ? `<span>Рекорд: <b>${fmtVal(ex, rec)}</b></span>` : ''}</div>`;
  else prev = `<div class="prev"><span>Первый раз — вперёд! 🚀</span></div>`;
  if (LG.tgt && ex.type !== 'check') prev = `<div class="prev planp"><span>📋 По плану: <b>${fmtTarget(LG.tgt)}</b></span><span>Сделано: <b>${Math.min(LG.sets.length, LG.tgt.sets || 1)} из ${LG.tgt.sets || 1}</b>${LG.sets.length >= (LG.tgt.sets || 1) ? ' ✅' : ''}</span></div>` + prev;
  let input = '';
  if (ex.type === 'reps') input = `
    <div class="lbl">Повторения</div>
    <div class="stepper"><button onclick="stepLG('reps',-1)">−</button><div style="flex:1"><input id="inReps" inputmode="numeric" value="${LG.reps}" onchange="LG.reps=Math.max(0,Math.round(num(this.value)))"><div class="u">повторов</div></div><button onclick="stepLG('reps',1)">+</button></div>
    <div class="lbl">Вес, кг (если с утяжелением)</div>
    <div class="stepper"><button onclick="stepLG('kg',-0.5)">−</button><div style="flex:1"><input id="inKg" inputmode="decimal" value="${LG.kg}" onchange="LG.kg=Math.max(0,num(this.value))"><div class="u">кг · 0 = свой вес</div></div><button onclick="stepLG('kg',0.5)">+</button></div>`;
  else if (ex.type === 'time') input = `
    <div class="lbl">Секундомер</div>
    <button class="sw" id="sw" onclick="swToggle()"><div><div class="v" id="swv">0:00</div><div class="s" id="sws">нажми, чтобы начать</div></div></button>
    <div class="lbl">Или вручную, секунд</div>

  else input = `<div class="lbl">Отметка</div><button class="check ${LG.done ? 'on' : ''}" onclick="LG.done=!LG.done;LG.sets=LG.done?[{done:1}]:[];vibe(15);renderLogger()">${LG.done ? '✓ Сделала!' : 'Отметить «сделала»'}</button>`;
  const sets = ex.type === 'check' ? '' : `<div class="lbl">Подходы сегодня</div><div class="sets">${LG.sets.length ? LG.sets.map((s, i) => `<span class="set"><i>${i + 1}</i>${esc(fmtSet(ex, s))}<button onclick="LG.sets.splice(${i},1);renderLogger()">✕</button></span>`).join('') : '<span class="muted small">Пока нет — добавь первый 👇</span>'}</div>
    <div class="two" style="margin-top:10px"><button class="btn mint" onclick="addSet()">${IC.plus} Подход</button><button class="btn" onclick="openRest(60)">${IC.timer} Отдых</button></div>`;
  const keepScroll = $('#sheet').scrollTop, wasOpen = sheetOpen();
  openSheet(head(esc(ex.name)) + `<div class="stage" data-fig="${ex.anim}" data-sync="1"></div>` + (ex.tip ? `<div class="tip">💡 ${esc(ex.tip)}</div>` : '') + prev + input + sets +
    `<button class="btn primary block" style="margin-top:18px" onclick="saveLogger()">Сохранить</button>` +
    ((S.sessions[LG.date] && S.sessions[LG.date][ex.id] && S.sessions[LG.date][ex.id].length) ? `<button class="btn ghost block" style="margin-top:6px" onclick="LG.sets=[];saveLogger(true)">Убрать из тренировки</button>` : ''));
  if (wasOpen) $('#sheet').scrollTop = keepScroll;
}
function stepLG(k, d) { LG[k] = Math.max(0, Math.round((num(LG[k]) + d) * 10) / 10); const el = { reps: '#inReps', kg: '#inKg', sec: '#inSec' }[k]; if ($(el)) $(el).value = LG[k]; vibe(8); }
function addSet() {
  const ex = exById(LG.id);
  if (ex.type === 'reps') { const r = Math.round(num($('#inReps').value)); if (r <= 0) return toast('Укажи количество повторов'); LG.reps = r; LG.kg = Math.max(0, num($('#inKg').value)); LG.sets.push({ reps: r, kg: LG.kg || 0 }); }
  else if (ex.type === 'time') { const s = Math.round(num($('#inSec').value)); if (s <= 0) return toast('Укажи время'); LG.sec = s; LG.sets.push({ sec: s }); }
  vibe(20); renderLogger();
}
function saveLogger(remove) {
  const ex = exById(LG.id);
  if (!remove && ex.type !== 'check' && !LG.sets.length) {
    if (ex.type === 'reps' && num($('#inReps').value) > 0) addSetSilently(ex);
    else if (ex.type === 'time' && num($('#inSec').value) > 0) addSetSilently(ex);
  }
  const prevBest = Math.max(0, ...history(ex.id).filter(x => x.d !== LG.date).map(x => x.best));
  S.sessions[LG.date] = S.sessions[LG.date] || {};
  if (LG.sets.length) S.sessions[LG.date][ex.id] = LG.sets; else delete S.sessions[LG.date][ex.id];
  if (!Object.keys(S.sessions[LG.date]).length) delete S.sessions[LG.date];
  save();
  const id = ex.id, had = LG.sets.length, date = LG.date;
  LG = null; closeSheet(); render();
  if (had) { afterSave(id, prevBest, date); }
}
function addSetSilently(ex) { if (ex.type === 'reps') LG.sets.push({ reps: Math.round(num($('#inReps').value)), kg: Math.max(0, num($('#inKg').value)) }); else LG.sets.push({ sec: Math.round(num($('#inSec').value)) }); }

/* stopwatch */
let SW = null;
function swToggle() {
  if (SW && SW.run) { const s = Math.round((Date.now() - SW.t0) / 1000); swStop(); if (s > 0) { LG.sec = s; LG.sets.push({ sec: s }); vibe([30, 40, 30]); toast('⏱ Записала ' + fmtSec(s)); renderLogger(); } return; }
  SW = { run: true, t0: Date.now(), iv: setInterval(() => { const el = $('#swv'); if (!el) return swStop(); el.textContent = fmtClock((Date.now() - SW.t0) / 1000); }, 200) };
  $('#sw').classList.add('run'); $('#sws').textContent = 'нажми, чтобы остановить'; vibe(20);
}
const fmtClock = s => { s = Math.floor(s); return Math.floor(s / 60) + ':' + pad(s % 60); };
function swStop() { if (SW) { clearInterval(SW.iv); SW = null; } }

/* rest timer */
let RT = null;
function openRest(sec) {
  restStop();
  const C = 2 * Math.PI * 92;
  openModal(`<div class="lbl" style="margin-top:0">Отдых</div><div class="ring"><svg viewBox="0 0 210 210"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9AAE"/><stop offset="1" stop-color="#B48CFF"/></linearGradient></defs><circle cx="105" cy="105" r="92" fill="none" stroke="#F2EAF8" stroke-width="14"/><circle id="rc" cx="105" cy="105" r="92" fill="none" stroke="url(#rg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="num" id="rn">${fmtClock(sec)}</div></div>
    <div class="seg" style="margin-bottom:12px">${[30, 60, 90, 120].map(s => `<button onclick="openRest(${s})" class="${s === sec ? 'on' : ''}">${s < 60 ? s + ' с' : (s / 60) + ' мин'}</button>`).join('')}</div>
    <div class="two"><button class="btn" onclick="if(RT){RT.end+=15000;RT.total+=15000}">+15 с</button><button class="btn primary" onclick="closeModal()">Готово</button></div>`);
  RT = { total: sec * 1000, end: Date.now() + sec * 1000, C, iv: setInterval(restTick, 100) };
}
function restTick() {
  if (!RT) return; const left = Math.max(0, RT.end - Date.now()), rn = $('#rn'), rc = $('#rc');
  if (!rn) return restStop();
  rn.textContent = fmtClock(Math.ceil(left / 1000));
  rc.setAttribute('stroke-dashoffset', String(RT.C * (1 - left / RT.total)));
  if (left <= 0) { restStop(); beep(); vibe([200, 100, 200]); rn.textContent = '💪'; setTimeout(() => { if (modalOpen()) closeModal(); toast('Погнали дальше! 💪'); }, 900); }
}
function restStop() { if (RT) { clearInterval(RT.iv); RT = null; } }
function beep() { try { const A = new (window.AudioContext || window.webkitAudioContext)(); [0, .18, .36].forEach((t, i) => { const o = A.createOscillator(), g = A.createGain(); o.frequency.value = i === 2 ? 1046 : 784; o.connect(g); g.connect(A.destination); g.gain.setValueAtTime(.0001, A.currentTime + t); g.gain.exponentialRampToValueAtTime(.3, A.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, A.currentTime + t + .16); o.start(A.currentTime + t); o.stop(A.currentTime + t + .17); }); } catch (e) {} }

/* after save: records, monthly progress, goals, achievements */
let CQ = [];
function afterSave(exId, prevBest, date, msg) {
  date = date || today();
  const ex = exById(exId), q = [];
  const rec = bestIn(exId, () => true), m = mkey(today()), pm = prevMonth(m);
  let recordToast = false;
  if (ex.type !== 'check' && prevBest > 0 && rec > prevBest) recordToast = true;
  const cur = bestIn(exId, d => mkey(d) === m), prev = bestIn(exId, d => mkey(d) === pm);
  if (ex.type !== 'check' && prev > 0 && cur > prev && !S.monthly[m + '|' + exId]) {
    S.monthly[m + '|' + exId] = today();
    const p = Math.round((cur - prev) / prev * 100);
    q.push({ e: '📈', t: 'Прогресс месяца!', x: `${ex.name}: в ${MONTHS_IN[Number(pm.slice(5)) - 1]} было ${fmtVal(ex, prev)}, а сейчас уже ${fmtVal(ex, cur)}. Это +${p}%! Ты растёшь 🌱` });
  }
  for (const g of S.goals) {
    if (g.done || g.exId !== exId) continue;
    if (goalCur(g) >= g.target) { g.done = today(); q.push({ e: '🎉', t: 'Цель достигнута!', x: `${ex.name} — ${fmtGoalVal(g, g.target)}. Вау, ты это сделала!`, prize: g.prize }); }
  }
  const pi = planItems(date), pp = planFor(date);
  if (pi.length && !S.planDone[date] && pi.every(i => itemProgress(i, date).done)) { S.planDone[date] = 1; q.unshift({ e: '🏁', t: 'Тренировка выполнена!', x: `«${pp.title || 'Тренировка'}» закрыта на 100%. Ты умничка! 🌸` }); }
  for (const a of ACH) if (!S.ach[a.id] && a.ok()) { S.ach[a.id] = today(); q.push({ e: a.e, t: 'Новое достижение', x: `«${a.n}» — ${a.d}` }); }
  save();
  if (recordToast) { toast('🏆 Новый рекорд: ' + fmtVal(ex, rec) + '!'); confetti(70); }
  else toast(msg || 'Сохранено 💖');
  if (q.length) { CQ.push(...q); setTimeout(nextCelebrate, recordToast ? 900 : 350); }
  render();
}
function nextCelebrate() {
  if (modalOpen() || !CQ.length) return;
  const c = CQ.shift();
  openModal(`<span class="big">${c.e}</span><h2>${esc(c.t)}</h2><p>${esc(c.x)}</p>${c.prize ? `<div class="prize"><small>Твоя награда</small>${esc(c.prize)}<br>уже едет к тебе! 🚚💨</div>` : ''}<button class="btn primary block" onclick="closeModal()">Ура! 💖</button>`);
  confetti(c.prize ? 220 : 140); vibe([40, 60, 40, 60, 80]);
}

}
function askReset() {
  openModal(`<span class="big" style="animation:none">⚠️</span><h2>Стереть всё?</h2><p>Тренировки, цели и достижения удалятся без возможности восстановления.</p><div class="two"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn danger" onclick="S=defState();S.onboarded=true;save();closeModal();closeSheet();render()">Стереть</button></div>`);
}

/* onboarding */
function onboarding() {
  openModal(`<span class="big">🌸</span><h2>Добро пожаловать в Sakura</h2><p>Твой личный трекер тренировок и растяжки. Записывай упражнения, следи за прогрессом и получай награды за цели!</p>
  <input class="field" id="obName" placeholder="Как тебя зовут?" maxlength="24" style="text-align:center;margin-bottom:12px">
  <button class="btn primary block" onclick="S.name=$('#obName').value.trim();S.onboarded=true;S.seenVersion=APP_VERSION;save();closeModal();render()">Начнём 💪</button>`);
}

/* confetti */
function confetti(n) {
  const cv = $('#confetti'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#FF9AAE','#C08BFF','#FFC94D','#4FCFA8','#FFB38A','#8EC5FF'];
  const ps = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .38, vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4, r: Math.random() * 6 + 4, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, va: (Math.random() - .5) * .4, s: Math.random() < .3 }));
  const t0 = performance.now();
  (function fr(now) {
    const el = now - t0; ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - el / 3000);
      if (p.s) { ctx.beginPath(); ctx.arc(0, 0, p.r / 2, 0, 7); ctx.fill(); } else ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }
    if (el < 3000) requestAnimationFrame(fr); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

/* android back button (Capacitor) */
function onBack() {
  if (modalOpen()) { closeModal(); return true; }
  if (sheetOpen() && DE && DE.picking) { DE.picking = false; renderDE(); return true; }
  if (sheetOpen()) { closeSheet(); return true; }
  if (U.tab !== 'today') { setTab('today'); return true; }
  return false;
}
try {
  const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (App) App.addListener('backButton', () => { if (!onBack()) App.exitApp(); });
} catch (e) {}

/* ---------- native: reminders ---------- */
let REMOPEN = false;
const CP = () => (window.Capacitor && window.Capacitor.Plugins) || {};
function isNative() { try { return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); } catch (e) { return false; } }
const NOTIF_ICON = { smallIcon: 'ic_stat_sakura', iconColor: '#C08BFF', channelId: 'sakura' };
async function initNative() {
  const L = CP().LocalNotifications; if (!L) return;
  try { await L.createChannel({ id: 'sakura', name: 'Тренировки', description: 'Напоминания о тренировках', importance: 5, visibility: 1, vibration: true }); } catch (e) {}
  scheduleReminders();
}
async function scheduleReminders() {
  const L = CP().LocalNotifications; if (!L) return;
  try {
    const pend = await L.getPending();
    const old = (pend.notifications || []).filter(n => n.id >= 100 && n.id < 110);
    if (old.length) await L.cancel({ notifications: old.map(n => ({ id: n.id })) });
    if (!S.remind.on) return;
    const [h, m] = (S.remind.time || '18:00').split(':').map(Number), list = [];
    for (let i = 0; i < 7; i++) {
      const d = S.plan[i], its = d && d.items ? d.items.filter(x => exById(x.exId)) : [];
      if (!its.length) continue;
      const names = its.slice(0, 3).map(x => exById(x.exId).name.toLowerCase()).join(', ') + (its.length > 3 ? ' и ещё ' + (its.length - 3) : '');
      list.push({ id: 100 + i, title: `🌸 ${S.name ? S.name + ', с' : 'С'}егодня у нас ${d.title || 'тренировка'}`, body: `${its.length} ${plural(its.length, ['упражнение','упражнения','упражнений'])}: ${names}. Погнали! 💪`,
        schedule: { on: { weekday: i === 6 ? 1 : i + 2, hour: h, minute: m }, allowWhileIdle: true }, ...NOTIF_ICON });
    }
    if (list.length) await L.schedule({ notifications: list });
  } catch (e) { console.log('reminders', e); }
}
async function remStatus() {
  const L = CP().LocalNotifications, st = { notif: null, exact: null };
  if (!L) return st;
  try { st.notif = (await L.checkPermissions()).display === 'granted'; } catch (e) {}
  try { st.exact = (await L.checkExactNotificationSetting()).exact_alarm === 'granted'; } catch (e) { st.exact = true; }
  return st;
}
async function openReminders() {
  const nat = isNative(), st = nat ? await remStatus() : { notif: null, exact: null };
  const step = (state, title, desc, act) => `<div class="step"><span class="st ${state === true ? 'ok' : state === false ? 'no' : ''}">${state === true ? '✓' : state === false ? '!' : '•'}</span><div class="grow"><b>${title}</b><div class="small muted">${desc}</div></div>${state === true || !nat ? '' : `<button class="btn" style="padding:8px 12px;font-size:13px" onclick="${act}">Открыть</button>`}</div>`;
  openSheet(head('🔔 Напоминания') + (nat ? '' : `<div class="tip">Напоминания работают в приложении на телефоне. Здесь — только предпросмотр.</div>`) +
    `<div class="card" style="margin:0 0 6px"><div class="row between"><b style="font-size:16px">Напоминать о тренировке</b><label class="switch"><input type="checkbox" ${S.remind.on ? 'checked' : ''} onchange="setRemindOn(this.checked)"><span></span></label></div>
    <div class="lbl">Во сколько</div><input class="field" type="time" value="${S.remind.time}" onchange="S.remind.time=this.value||'18:00';save();scheduleReminders();toast('Время сохранено ⏰')">
    <div class="small muted" style="margin-top:8px">Приходит только в дни, где в плане есть тренировка.</div></div>
    <div class="lbl">Чтобы Xiaomi не глушил уведомления</div>` +
    step(st.notif, '1. Разрешить уведомления', 'Без этого напоминания не появятся', 'askNotif()') +
    step(st.exact, '2. Будильники и напоминания', 'Чтобы приходило минута в минуту', 'openExact()') +
    step(null, '3. Батарея → «Нет ограничений»', 'В настройках приложения: «Контроль активности» → «Нет ограничений»', 'openAppSettings()') +
    step(null, '4. Автозапуск → включить', 'Там же включи «Автозапуск», чтобы напоминания пережили перезагрузку', 'openAppSettings()') +
    `<button class="btn mint block" style="margin-top:8px" onclick="testNotif()">🧪 Тестовое уведомление через 10 с</button>`);
  REMOPEN = true;
}
async function setRemindOn(on) {
  S.remind.on = on; save();
  if (on && isNative()) await askNotif(true);
  await scheduleReminders(); toast(on ? 'Напоминания включены 🔔' : 'Напоминания выключены'); render();
}
async function askNotif(silent) {
  const L = CP().LocalNotifications; if (!L) return;
  try { const r = await L.requestPermissions(); if (r.display !== 'granted') { const N = CP().NativeSettings; if (N) await N.openAndroid({ option: 'app_notification' }); } } catch (e) {}
  if (REMOPEN && !silent) openReminders();
}
async function openExact() { try { await CP().LocalNotifications.changeExactNotificationSetting(); } catch (e) { openAppSettings(); } }
async function openAppSettings() { try { await CP().NativeSettings.openAndroid({ option: 'application_details' }); } catch (e) { toast('Открой: Настройки → Приложения → Sakura'); } }
async function testNotif() {
  const L = CP().LocalNotifications; if (!L) return toast('Работает только в приложении на телефоне');
  try { await L.schedule({ notifications: [{ id: 999, title: '🌸 Sakura', body: 'Тест: напоминания работают! 💪', schedule: { at: new Date(Date.now() + 10000), allowWhileIdle: true }, ...NOTIF_ICON }] }); toast('Сверни приложение и подожди 10 секунд ⏳'); }
  catch (e) { toast('Не получилось — проверь разрешения'); }
}

/* ---------- updates ---------- */
function vcmp(a, b) { a = String(a).split('.').map(Number); b = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { const d = (a[i] || 0) - (b[i] || 0); if (d) return d > 0 ? 1 : -1; } return 0; }
async function nativeBuild() { try { return +(await CP().App.getInfo()).build || 0; } catch (e) { return 0; } }
let UPD_BUSY = false;
async function checkUpdates(manual) {
  if (!isNative() || UPD_BUSY) return; UPD_BUSY = true;
  try {
    const u = await (await fetch(UPDATE_URL + '?t=' + Date.now(), { cache: 'no-store' })).json();
    const build = await nativeBuild();
    if (u.apk && +u.apk.build > build) { showUpd('apk', u.apk); return; }
    if (u.web && vcmp(u.web.version, APP_VERSION) > 0 && (!u.web.minBuild || build >= u.web.minBuild)) {
      let cur = null; try { cur = JSON.parse(localStorage.getItem('sakura_ota') || 'null'); } catch (e) {}
      if (!cur || cur.v !== u.web.version) {
        const h = await (await fetch(u.web.url + '?t=' + Date.now(), { cache: 'no-store' })).text();
        if (!h.includes('name="sakura-version" content="' + u.web.version + '"')) return;
        localStorage.setItem('sakura_ota', JSON.stringify({ v: u.web.version, html: h }));
      }
      showUpd('web', u.web); return;
    }
    if (manual) toast('У тебя последняя версия ✅');
  } catch (e) { if (manual) toast('Нет связи — попробуй позже'); }
  finally { UPD_BUSY = false; }
}
function showUpd(kind, u) {
  if ($('.upd')) $('.upd').remove();
  const el = document.createElement('div'); el.className = 'upd';
  el.innerHTML = kind === 'web'
    ? `<span style="font-size:26px">✨</span><div class="grow">Обновление ${esc(u.version)} готово<small>${esc(u.notes || 'Новые фишки внутри')}</small></div><button class="btn primary" onclick="location.reload()">Обновить</button>`
    : `<span style="font-size:26px">📲</span><div class="grow">Новая версия ${esc(u.version)}<small>Скачай и установи поверх — данные сохранятся</small></div><button class="btn primary" onclick="location.href='${esc(u.url)}'">Скачать</button>`;
  document.body.appendChild(el);
}
function showWhatsNew() {
  openModal(`<span class="big">✨</span><h2>Что нового в ${APP_VERSION}</h2><ul class="wn">${WHATS_NEW.map(x => `<li>${esc(x)}</li>`).join('')}</ul><button class="btn primary block" onclick="closeModal()">Круто! 💖</button>`);
}

render();
if (!S.onboarded) setTimeout(onboarding, 400);
else if (S.seenVersion !== APP_VERSION) { S.seenVersion = APP_VERSION; save(); setTimeout(showWhatsNew, 500); }
try { localStorage.setItem('sakura_ota_ok', APP_VERSION); } catch (e) {}
if (isNative()) {
  initNative();
  setTimeout(checkUpdates, 2500);
  try { CP().App.addListener('resume', () => { if (REMOPEN && sheetOpen()) openReminders(); render(); setTimeout(checkUpdates, 1500); }); } catch (e) {}
}
</script>
